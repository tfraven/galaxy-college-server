<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://source.zoom.us" crossorigin>
  <title>Galaxy College Live Class</title>
  <style>
    html,body{margin:0;width:100%;height:100%;min-height:100%;background:#0b1220;color:#e2e8f0;font:15px Arial,sans-serif;overflow:hidden}
    body{min-height:100dvh;overscroll-behavior:none}
    #status{position:fixed;z-index:10000;top:max(12px,env(safe-area-inset-top,12px));left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 32px));display:grid;place-items:center;text-align:center;padding:12px 16px;box-sizing:border-box;background:rgba(11,18,32,.94);border:1px solid #334155;border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.35);pointer-events:none}
    #status>div{max-width:520px}#detail{color:#94a3b8;line-height:1.5;margin-top:9px}
    #zmmtg-root{position:fixed!important;inset:0!important;display:block!important;width:100vw!important;height:100dvh!important;min-height:0!important;max-width:100vw!important;overflow:hidden!important}
    #zmmtg-root>*{max-width:100vw!important}
    button[aria-label*="invite" i],button[title*="invite" i],
    [role="button"][aria-label*="invite" i],[role="button"][title*="invite" i],
    a[href*="/j/"],a[href*="/w/"]{display:none!important}
    @supports not (height:100dvh){body{min-height:100vh}#zmmtg-root{height:100vh!important}}
    @media(max-width:600px){
      html,body{font-size:14px}
      #status{top:max(8px,env(safe-area-inset-top,8px));width:calc(100% - 20px);padding:10px 12px;border-radius:10px}
      #detail{font-size:13px;line-height:1.4;margin-top:6px}
    }
    @media(orientation:landscape) and (max-height:500px){
      #status{top:4px;padding:6px 10px}
      #status>div{font-size:12px}
      #detail{font-size:11px;margin-top:3px}
    }
    html.student-mode button[aria-label*="mute" i],html.student-mode button[title*="mute" i],
    html.student-mode button[aria-label*="microphone" i],html.student-mode button[title*="microphone" i],
    html.student-mode button[aria-label*="start video" i],html.student-mode button[aria-label*="stop video" i],
    html.student-mode button[aria-label*="camera" i],html.student-mode button[title*="camera" i],
    html.student-mode button[aria-label*="share screen" i],html.student-mode button[title*="share screen" i],
    html.student-mode button[aria-label*="participant" i],html.student-mode button[title*="participant" i],
    html.student-mode button[aria-label*="record" i],html.student-mode button[title*="record" i],
    html.student-mode button[aria-label*="reaction" i],html.student-mode button[title*="reaction" i],
    html.student-mode button[aria-label*="poll" i],html.student-mode button[title*="poll" i],
    html.student-mode button[aria-label*="breakout" i],html.student-mode button[title*="breakout" i],
    html.student-mode button[aria-label*="caption" i],html.student-mode button[title*="caption" i],
    html.student-mode button[aria-label*="whiteboard" i],html.student-mode button[title*="whiteboard" i],
    html.student-mode button[aria-label="More" i],html.student-mode button[title="More" i] { display:none !important }
  </style>
</head>
<body>
  <div id="status"><div><strong id="message">Connecting to the Zoom meeting…</strong><div id="detail">Joining your scheduled live class. Please wait.</div></div></div>
  <div id="zmmtg-root"></div>
  <div id="aria-notify-area"></div>
  <script defer src="https://source.zoom.us/6.5.0/lib/vendor/react.min.js"></script>
  <script defer src="https://source.zoom.us/6.5.0/lib/vendor/react-dom.min.js"></script>
  <script defer src="https://source.zoom.us/6.5.0/lib/vendor/redux.min.js"></script>
  <script defer src="https://source.zoom.us/6.5.0/lib/vendor/redux-thunk.min.js"></script>
  <script defer src="https://source.zoom.us/6.5.0/lib/vendor/react-redux.min.js"></script>
  <script defer src="https://source.zoom.us/6.5.0/lib/vendor/lodash.min.js"></script>
  <script defer src="https://source.zoom.us/zoom-meeting-6.5.0.min.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
    (function () {
      var message = document.getElementById('message');
      var detail = document.getElementById('detail');
      var status = document.getElementById('status');
      var values = new URLSearchParams(window.location.hash.slice(1));
      var signature = values.get('j');
      var meetingNumber = values.get('m');
      var password = values.get('p') || '';
      var userName = values.get('n') || 'Galaxy College participant';
      var zak = values.get('z') || undefined;
      var isHost = values.get('h') === '1';
      var requestedMode = values.get('r');
      var isStudent = !isHost && requestedMode !== 'participant';
      if (isStudent) {
        document.documentElement.classList.add('student-mode');
        detail.textContent = 'Camera and microphone are disabled. Use chat to message your teacher.';
      }
      var leftUrl = window.location.origin + window.location.pathname + '?left=1';
      function postClassroomEvent(name, messageText) {
        var payload = { type: 'galaxy-classroom-' + name };
        if (messageText) payload.message = messageText;
        try { window.parent.postMessage(payload, '*'); } catch (error) {}
        try { if (window.opener && !window.opener.closed) window.opener.postMessage(payload, '*'); } catch (error) {}
        try {
          if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
            window.ReactNativeWebView.postMessage(JSON.stringify(payload));
          }
        } catch (error) {}
        try {
          if (window.GalaxyClassroom && window.GalaxyClassroom.postEvent) {
            window.GalaxyClassroom.postEvent(JSON.stringify(payload));
          }
        } catch (error) {}
      }

      if (new URLSearchParams(window.location.search).has('left')) {
        message.textContent = 'You left the live class.';
        detail.textContent = 'Close this window to return to Galaxy College.';
        postClassroomEvent('left');
        return;
      }
      if (!signature || !meetingNumber || (isHost && !zak)) {
        message.textContent = 'Could not open this live class.';
        detail.textContent = 'The meeting details are missing or have expired. Return to the live classes page and join again.';
        postClassroomEvent('error', detail.textContent);
        return;
      }
      if (!window.ZoomMtg) {
        message.textContent = 'Zoom Meeting SDK could not be loaded.';
        detail.textContent = 'Check your connection and try again.';
        postClassroomEvent('error', detail.textContent);
        return;
      }

      window.history.replaceState(null, '', window.location.pathname);
      window.ZoomMtg.setZoomJSLib('https://source.zoom.us/6.5.0/lib', '/av');
      window.ZoomMtg.preLoadWasm();
      window.ZoomMtg.prepareWebSDK();
      window.ZoomMtg.init({
        leaveUrl: leftUrl,
        patchJsMedia: true,
        disableInvite: true,
        disableRecord: true,
        disableCallOut: isStudent,
        disableZoomPhone: isStudent,
        disableReport: isStudent,
        disablePreview: true,
        showMeetingHeader: !isStudent,
        meetingInfo: isStudent ? ['topic'] : ['topic', 'host', 'participant'],
        isSupportAV: true,
        isSupportChat: true,
        isSupportQA: !isStudent,
        isSupportPolling: !isStudent,
        isSupportBreakout: !isStudent,
        isSupportCC: !isStudent,
        isSupportNonverbal: !isStudent,
        screenShare: !isStudent,
        success: function () {
          message.textContent = 'Joining the Zoom meeting…';
          detail.textContent = 'Waiting for Zoom to connect you to the class.';
          var joinFinished = false;
          function handleJoinError(error) {
            if (joinFinished) return;
            joinFinished = true;
            window.removeEventListener('unhandledrejection', handleUnhandledJoinRejection);
            var errorCode = Number(error && (error.errorCode || error.code));
            message.textContent = 'Could not join the Zoom meeting.';
            detail.textContent = errorCode === 4011
              ? 'Zoom error 4011: this meeting belongs to a different Zoom account than the Meeting SDK app. Create a General app with Meeting SDK turned on while signed in as the same Zoom user who hosts the class, put that app’s Client ID and Client Secret in ZOOM_SDK_KEY and ZOOM_SDK_SECRET, then create the class again. The Server-to-Server app is only activated, not published.'
              : (errorCode === 3051 || errorCode === 3052)
                ? 'Zoom is requiring account sign-in. Ask the Zoom account admin to disable the meeting authentication requirement for this host account.'
              : (error && (error.reason || error.message)) || 'Check that the meeting is live and try again.';
            console.error('[classroom] Zoom join failed', {
              errorCode: errorCode || undefined,
              reason: error && error.reason,
              message: error && error.message,
            });
            postClassroomEvent('error', detail.textContent);
          }
          function handleUnhandledJoinRejection(event) {
            if (joinFinished) return;
            var error = event && event.reason;
            var errorCode = Number(error && (error.errorCode || error.code));
            if (errorCode !== 4011 && (!error || error.type !== 'JOIN_MEETING_FAILED')) return;
            event.preventDefault();
            handleJoinError(error);
          }

          window.addEventListener('unhandledrejection', handleUnhandledJoinRejection);
          try {
            var joinResult = window.ZoomMtg.join({
              signature: signature,
              meetingNumber: meetingNumber,
              passWord: password,
              userName: userName,
              zak: zak,
              success: function () {
                if (joinFinished) return;
                joinFinished = true;
                window.removeEventListener('unhandledrejection', handleUnhandledJoinRejection);
                status.style.display = 'none';
                document.getElementById('zmmtg-root').style.display = 'block';
                window.ZoomMtg.showInviteFunction({ show: false });
                window.ZoomMtg.showRecordFunction({ show: false });
                var controlSelector = 'button,[role="button"],a';
                var watchControls = function (blocked, preserveChatAndLeave) {
                  var applyBlockedControls = function (root, includeChildren) {
                    if (!root || root.nodeType !== 1) return;
                    var candidates = new Set();
                    var closest = root.closest && root.closest(controlSelector);
                    if (closest) candidates.add(closest);
                    if (root.matches && root.matches(controlSelector)) candidates.add(root);
                    if (includeChildren && root.querySelectorAll) {
                      root.querySelectorAll(controlSelector).forEach(function (control) { candidates.add(control); });
                    }
                    candidates.forEach(function (control) {
                      var label = [
                        control.getAttribute('aria-label'),
                        control.getAttribute('title'),
                        control.getAttribute('data-tooltip'),
                        control.textContent,
                        control.getAttribute('href')
                      ].filter(Boolean).join(' ').trim();
                      if (preserveChatAndLeave && /\b(chat|leave)\b/i.test(label)) return;
                      if (blocked.test(label)) control.style.setProperty('display', 'none', 'important');
                    });
                  };
                  applyBlockedControls(document.body, true);
                  var observer = new MutationObserver(function (changes) {
                    changes.forEach(function (change) {
                      applyBlockedControls(change.target, false);
                      change.addedNodes && change.addedNodes.forEach(function (node) {
                        applyBlockedControls(node, true);
                      });
                    });
                  });
                  observer.observe(document.body, {
                    childList: true,
                    subtree: true,
                    attributes: true,
                    attributeFilter: ['aria-label', 'title', 'data-tooltip', 'href']
                  });
                  return observer;
                };
                watchControls(/\binvite\b|copy\s+(?:meeting\s+)?(?:link|url)\b|meeting\s+link\b/i, false);
                if (isStudent) {
                  window.ZoomMtg.showMeetingHeader({ show: false });
                  watchControls(/\b(mute|unmute|audio|microphone|start video|stop video|camera|share screen|participants|invite|record|reaction|poll|breakout|caption|whiteboard|more)\b/i, true);
                }
                postClassroomEvent('joined');
              },
              error: handleJoinError,
            });
            if (joinResult && typeof joinResult.catch === 'function') {
              joinResult.catch(handleJoinError);
            }
          } catch (error) {
            handleJoinError(error);
          }
        },
        error: function (error) {
          message.textContent = 'Could not start the Zoom meeting.';
          detail.textContent = error && error.message ? error.message : 'Check your connection and try again.';
          postClassroomEvent('error', detail.textContent);
        },
      });
    }());
    }, { once: true });
  </script>
</body>
</html>
