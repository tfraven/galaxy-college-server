<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>
    if (new URLSearchParams(window.location.hash.slice(1)).get('e') === '1') {
      document.documentElement.classList.add('native-embedded');
    }
  </script>
  <link rel="preconnect" href="https://source.zoom.us" crossorigin>
  <link rel="preconnect" href="https://dmogdx0jrul3u.cloudfront.net" crossorigin>
  <link rel="preload" as="script" href="https://source.zoom.us/6.10.0/lib/vendor/react.min.js">
  <link rel="preload" as="script" href="https://source.zoom.us/6.10.0/lib/vendor/react-dom.min.js">
  <link rel="preload" as="script" href="https://source.zoom.us/6.10.0/lib/vendor/redux.min.js">
  <link rel="preload" as="script" href="https://source.zoom.us/6.10.0/lib/vendor/redux-thunk.min.js">
  <link rel="preload" as="script" href="https://source.zoom.us/6.10.0/lib/vendor/react-redux.min.js">
  <link rel="preload" as="script" href="https://source.zoom.us/6.10.0/lib/vendor/lodash.min.js">
  <link rel="preload" as="script" href="https://source.zoom.us/6.10.0/zoom-meeting-6.10.0.min.js">
  <title>Galaxy College Live Class</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      background: #0b1220;
      color: #e2e8f0;
      font: 15px Arial, sans-serif;
      overflow: hidden
    }

    body {
      min-height: 100dvh;
      overscroll-behavior: none
    }

    #status {
      position: fixed;
      z-index: 10000;
      top: max(12px, env(safe-area-inset-top, 12px));
      left: 50%;
      transform: translateX(-50%);
      width: min(520px, calc(100% - 32px));
      display: grid;
      place-items: center;
      text-align: center;
      padding: 12px 16px;
      box-sizing: border-box;
      background: rgba(11, 18, 32, .94);
      border: 1px solid #334155;
      border-radius: 12px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, .35);
      pointer-events: none
    }

    #status::before {
      content: "";
      width: 18px;
      height: 18px;
      margin-bottom: 10px;
      border: 2px solid rgba(148, 163, 184, .32);
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: classroom-spin .8s linear infinite
    }

    #status.error::before { display: none }

    @keyframes classroom-spin { to { transform: rotate(360deg) } }

    #status>div {
      max-width: 520px
    }

    #detail {
      color: #94a3b8;
      line-height: 1.5;
      margin-top: 9px
    }

    /* Embedded Android renders the single loading state in Compose. */
    html.native-embedded #status {
      display: none !important
    }

    /* Zoom writes live announcements here; keep them available to assistive tech without showing raw text. */
    #aria-notify-area {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      margin: -1px !important;
      padding: 0 !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important
    }

    #galaxy-zoom-chat[hidden] { display: none !important }

    #galaxy-zoom-chat {
      position: fixed;
      top: var(--galaxy-zoom-chat-top, 0px);
      left: 0;
      right: 0;
      height: var(--galaxy-zoom-chat-height, 100%);
      z-index: 2147483647;
      display: flex;
      flex-direction: column;
      background: #191a1c;
      color: #f4f4f5;
      font: 14px Arial, sans-serif;
      padding-top: env(safe-area-inset-top, 0px);
      box-sizing: border-box;
      overflow: hidden
    }

    #galaxy-zoom-chat header {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 54px;
      flex: 0 0 auto;
      padding: 0 16px;
      border-bottom: 1px solid rgba(255,255,255,.1);
      box-sizing: border-box
    }

    #galaxy-zoom-chat-close {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 20px;
      background: transparent;
      color: #f4f4f5;
      font-size: 26px
    }

    #galaxy-zoom-chat-notifications {
      min-width: 40px;
      height: 40px;
      border: 0;
      border-radius: 20px;
      background: transparent;
      color: #d4d4d8;
      font-size: 18px
    }

    #galaxy-zoom-chat-heading { flex: 1; font-weight: 600 }
    #galaxy-zoom-chat-recipient { color: #a1a1aa; font-size: 12px }

    #galaxy-zoom-chat-messages {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-sizing: border-box
    }

    .galaxy-zoom-chat-empty {
      margin: auto;
      color: #a1a1aa;
      text-align: center
    }

    .galaxy-zoom-chat-message {
      max-width: 88%;
      align-self: flex-start;
      padding: 9px 12px;
      border-radius: 12px;
      background: #292a2d;
      overflow-wrap: anywhere
    }

    .galaxy-zoom-chat-message.mine {
      align-self: flex-end;
      background: #174e43
    }

    .galaxy-zoom-chat-meta {
      margin-bottom: 4px;
      color: #b9c2c0;
      font-size: 11px
    }

    .galaxy-zoom-chat-body { white-space: pre-wrap; line-height: 1.4 }

    #galaxy-zoom-chat-form {
      display: flex;
      flex: 0 0 auto;
      gap: 8px;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid rgba(255,255,255,.1);
      background: #191a1c;
      box-sizing: border-box
    }

    #galaxy-zoom-chat-input {
      flex: 1;
      min-width: 0;
      height: 42px;
      border: 1px solid #45464a;
      border-radius: 21px;
      padding: 0 14px;
      outline: none;
      background: #252629;
      color: #f4f4f5;
      font: inherit;
      box-sizing: border-box
    }

    #galaxy-zoom-chat-send {
      min-width: 64px;
      border: 0;
      border-radius: 21px;
      padding: 0 16px;
      background: #2d8c72;
      color: white;
      font: inherit;
      font-weight: 600
    }

    #galaxy-zoom-chat-send:disabled { opacity: .55 }
    #galaxy-zoom-chat-error { padding: 0 16px 8px; color: #fca5a5; font-size: 12px }

    #galaxy-zoom-chat-toast[hidden],
    #galaxy-zoom-options[hidden] { display: none !important }

    html:not(.native-embedded) #galaxy-zoom-chat-toast,
    html:not(.native-embedded) #galaxy-zoom-options { display: none !important }

    /* The Android app already has a native meeting title bar. Keep Zoom's
       duplicate meeting details and view switcher out of its embedded UI. */
    html.native-embedded #meeting-info-indication,
    html.native-embedded #meeting-info-encryption-indication,
    html.native-embedded #zmmtg-root [aria-label="Meeting information"],
    html.native-embedded #zmmtg-root [title="Meeting information"],
    html.native-embedded #zmmtg-root [aria-label="Encryption information"],
    html.native-embedded #zmmtg-root [title="Encryption information"],
    html.native-embedded #zmmtg-root [aria-label="View"],
    html.native-embedded #zmmtg-root [title="View"] { display: none !important }

    #galaxy-zoom-chat-toast {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: calc(62px + env(safe-area-inset-bottom, 0px));
      z-index: 2147483646;
      display: flex;
      width: calc(100% - 32px);
      max-width: 360px;
      margin: 0 auto;
      border-radius: 14px;
      background: #292a2d;
      color: #f4f4f5;
      box-shadow: 0 8px 24px rgba(0,0,0,.38);
      overflow: hidden;
      font: 14px Arial, sans-serif
    }

    #galaxy-zoom-chat-toast-open {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      border: 0;
      background: transparent;
      color: inherit;
      text-align: left;
      font: inherit
    }

    #galaxy-zoom-chat-toast-sender,
    #galaxy-zoom-chat-toast-preview {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    #galaxy-zoom-chat-toast-sender { color: #d4d4d8; font-size: 12px; font-weight: 600 }
    #galaxy-zoom-chat-toast-preview { margin-top: 4px; color: #fff }

    #galaxy-zoom-chat-toast-close {
      flex: 0 0 40px;
      border: 0;
      background: transparent;
      color: #a1a1aa;
      font: 20px Arial, sans-serif
    }

    #galaxy-zoom-options {
      position: fixed;
      top: var(--galaxy-zoom-chat-top, 0px);
      left: 0;
      right: 0;
      height: var(--galaxy-zoom-chat-height, 100%);
      z-index: 2147483646;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: rgba(0,0,0,.58);
      color: #f4f4f5;
      font: 14px Arial, sans-serif;
      box-sizing: border-box
    }

    #galaxy-zoom-options-sheet {
      width: min(520px, 100%);
      max-height: 88%;
      padding: 10px 16px calc(18px + env(safe-area-inset-bottom, 0px));
      border-radius: 20px 20px 0 0;
      background: #202124;
      box-shadow: 0 -8px 32px rgba(0,0,0,.32);
      box-sizing: border-box
    }

    #galaxy-zoom-options header {
      display: flex;
      align-items: center;
      min-height: 48px;
      gap: 12px
    }

    #galaxy-zoom-options-title { flex: 1; font-size: 16px; font-weight: 600 }

    #galaxy-zoom-options-close {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 20px;
      background: transparent;
      color: #f4f4f5;
      font-size: 24px
    }

    #galaxy-zoom-options-description {
      margin: 6px 0 16px;
      color: #c4c4c8;
      line-height: 1.45
    }

    .galaxy-zoom-option-button {
      width: 100%;
      min-height: 48px;
      margin-top: 8px;
      padding: 0 14px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px;
      background: #2b2c30;
      color: #f4f4f5;
      text-align: left;
      font: inherit
    }

    button[aria-label*="invite" i],
    button[title*="invite" i],
    [role="button"][aria-label*="invite" i],
    [role="button"][title*="invite" i],
    a[href*="/j/"],
    a[href*="/w/"] {
      display: none !important
    }

    @media(max-width:600px) {

      html,
      body {
        font-size: 14px
      }

      #status {
        top: max(8px, env(safe-area-inset-top, 8px));
        width: calc(100% - 20px);
        padding: 10px 12px;
        border-radius: 10px
      }

      #detail {
        font-size: 13px;
        line-height: 1.4;
        margin-top: 6px
      }
    }

    @media(orientation:landscape) and (max-height:500px) {
      #status {
        top: 4px;
        padding: 6px 10px
      }

      #status>div {
        font-size: 12px
      }

      #detail {
        font-size: 11px;
        margin-top: 3px
      }
    }

    /* Keep student video/share controls hidden in the app; the website toolbar is separately allowlisted. */
    html.student-mode #zmmtg-root button[aria-label*="video" i]:not([aria-label*="view" i]),
    html.student-mode #zmmtg-root button[title*="video" i]:not([title*="view" i]),
    html.student-mode #zmmtg-root button[data-tooltip*="video" i]:not([data-tooltip*="view" i]),
    html.student-mode #zmmtg-root [role="button"][aria-label*="video" i]:not([aria-label*="view" i]),
    html.student-mode #zmmtg-root [role="button"][title*="video" i]:not([title*="view" i]),
    html.student-mode #zmmtg-root [role="button"][data-tooltip*="video" i]:not([data-tooltip*="view" i]),
    html.student-mode #zmmtg-root button[aria-label*="camera" i]:not([aria-label*="join" i]):not([aria-label*="view" i]),
    html.student-mode #zmmtg-root button[aria-label*="share screen" i],
    html.student-mode #zmmtg-root button[title*="share screen" i],
    html.student-mode #zmmtg-root button[aria-label*="record" i],
    html.student-mode #zmmtg-root button[title*="record" i],
    html.student-mode #zmmtg-root button[aria-label*="reaction" i],
    html.student-mode #zmmtg-root button[title*="reaction" i],
    html.student-mode #zmmtg-root button[aria-label*="poll" i],
    html.student-mode #zmmtg-root button[title*="poll" i],
    html.student-mode #zmmtg-root button[aria-label*="breakout" i],
    html.student-mode #zmmtg-root button[title*="breakout" i],
    html.student-mode #zmmtg-root button[aria-label*="caption" i],
    html.student-mode #zmmtg-root button[title*="caption" i],
    html.student-mode #zmmtg-root button[aria-label*="whiteboard" i],
    html.student-mode #zmmtg-root button[title*="whiteboard" i] {
      display: none !important
    }
  </style>
</head>

<body>
  <div id="status" role="status" aria-live="polite">
    <div><strong id="message">Connecting to the Zoom meeting…</strong>
      <div id="detail">Joining your scheduled live class. Please wait.</div>
    </div>
  </div>
  <div id="zmmtg-root"></div>
  <section id="galaxy-zoom-chat" hidden aria-hidden="true" aria-label="Meeting chat">
    <header>
      <button id="galaxy-zoom-chat-close" type="button" aria-label="Close chat">×</button>
      <div id="galaxy-zoom-chat-heading">Meeting Chat</div>
      <div id="galaxy-zoom-chat-recipient">To Everyone</div>
      <button id="galaxy-zoom-chat-notifications" type="button" aria-label="Mute chat notifications" aria-pressed="false" title="Mute chat notifications">🔔</button>
    </header>
    <div id="galaxy-zoom-chat-messages" role="log" aria-live="polite"></div>
    <div id="galaxy-zoom-chat-error" hidden></div>
    <form id="galaxy-zoom-chat-form">
      <input id="galaxy-zoom-chat-input" type="text" maxlength="1000" autocomplete="off" placeholder="Message everyone" aria-label="Message everyone">
      <button id="galaxy-zoom-chat-send" type="submit">Send</button>
    </form>
  </section>
  <div id="galaxy-zoom-chat-toast" hidden role="status" aria-live="polite">
    <button id="galaxy-zoom-chat-toast-open" type="button" aria-label="Open meeting chat">
      <span id="galaxy-zoom-chat-toast-sender"></span>
      <span id="galaxy-zoom-chat-toast-preview"></span>
    </button>
    <button id="galaxy-zoom-chat-toast-close" type="button" aria-label="Dismiss message alert">×</button>
  </div>
  <section id="galaxy-zoom-options" hidden aria-hidden="true" aria-label="Meeting options">
    <div id="galaxy-zoom-options-sheet" role="dialog" aria-modal="true" aria-labelledby="galaxy-zoom-options-title">
      <header>
        <div id="galaxy-zoom-options-title">More options</div>
        <button id="galaxy-zoom-options-close" type="button" aria-label="Close options">×</button>
      </header>
      <p id="galaxy-zoom-options-description"></p>
      <button id="galaxy-zoom-options-chat" class="galaxy-zoom-option-button" type="button">Open meeting chat</button>
    </div>
  </section>
  <div id="aria-notify-area"></div>
  <script>
    function loadZoomScript(src) {
      return new Promise(function (resolve, reject) {
        var script = document.createElement('script');
        script.src = src;
        // Dynamic scripts download in parallel but execute in insertion order.
        script.async = false;
        script.onload = resolve;
        script.onerror = function () { reject(new Error('A Zoom media library could not be downloaded.')); };
        document.head.appendChild(script);
      });
    }

    function loadZoomSdk() {
      if (window.ZoomMtg) return Promise.resolve();
      var base = 'https://source.zoom.us/6.10.0';
      var dependencies = [
        base + '/lib/vendor/react.min.js',
        base + '/lib/vendor/react-dom.min.js',
        base + '/lib/vendor/redux.min.js',
        base + '/lib/vendor/redux-thunk.min.js',
        base + '/lib/vendor/react-redux.min.js',
        base + '/lib/vendor/lodash.min.js',
      ];
      dependencies.push(base + '/zoom-meeting-6.10.0.min.js');
      // Start the large meeting bundle with its vendors. async=false keeps execution in the required order.
      return Promise.all(dependencies.map(loadZoomScript));
    }

    window.addEventListener('DOMContentLoaded', function () {
      (async function () {
        var message = document.getElementById('message');
        var detail = document.getElementById('detail');
        var status = document.getElementById('status');
        var values = new URLSearchParams(window.location.hash.slice(1));
        var signature = values.get('j');
        var meetingNumber = values.get('m');
        var password = values.get('p') || '';
        var userName = values.get('n') || 'Galaxy College participant';
        var zak = values.get('z') || undefined;
        var isHost = values.get('h') === '1';
        var requestedMode = values.get('r');
        var isStudent = !isHost && requestedMode !== 'participant';
        var restrictStudentToolbar = isStudent && !document.documentElement.classList.contains('native-embedded');
        var joinWithAudio = values.get('a') !== '0';

        if (isStudent) {
          document.documentElement.classList.add('student-mode');
          detail.textContent = 'Your camera stays off. Your microphone starts muted; use Zoom’s Unmute control if you need to speak.';
        }
        var leftUrl = window.location.origin + window.location.pathname + '?left=1';
        function postClassroomEvent(name, messageText) {
          var payload = { type: 'galaxy-classroom-' + name };
          if (messageText) payload.message = messageText;
          try { window.parent.postMessage(payload, '*'); } catch (error) { }
          try { if (window.opener && !window.opener.closed) window.opener.postMessage(payload, '*'); } catch (error) { }
          try {
            if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
              window.ReactNativeWebView.postMessage(JSON.stringify(payload));
            }
          } catch (error) { }
          try {
            if (window.GalaxyClassroom && window.GalaxyClassroom.postEvent) {
              window.GalaxyClassroom.postEvent(JSON.stringify(payload));
            }
          } catch (error) { }
        }

        var meetingJoined = false;
        var pendingPanel = null;
        var zoomChatMessages = [];
        var zoomChatPanel = document.getElementById('galaxy-zoom-chat');
        var zoomChatList = document.getElementById('galaxy-zoom-chat-messages');
        var zoomChatInput = document.getElementById('galaxy-zoom-chat-input');
        var zoomChatSend = document.getElementById('galaxy-zoom-chat-send');
        var zoomChatError = document.getElementById('galaxy-zoom-chat-error');
        var zoomChatToast = document.getElementById('galaxy-zoom-chat-toast');
        var zoomChatToastSender = document.getElementById('galaxy-zoom-chat-toast-sender');
        var zoomChatToastPreview = document.getElementById('galaxy-zoom-chat-toast-preview');
        var zoomOptionsPanel = document.getElementById('galaxy-zoom-options');
        var zoomOptionsTitle = document.getElementById('galaxy-zoom-options-title');
        var zoomOptionsDescription = document.getElementById('galaxy-zoom-options-description');
        var zoomChatToastTimer = null;
        var zoomChatNotificationsMuted = false;

        function syncZoomVisibleViewport() {
          var viewport = window.visualViewport;
          var top = viewport ? viewport.offsetTop : 0;
          var height = viewport ? viewport.height : window.innerHeight;
          document.documentElement.style.setProperty('--galaxy-zoom-chat-top', Math.max(0, top) + 'px');
          document.documentElement.style.setProperty('--galaxy-zoom-chat-height', Math.max(1, height) + 'px');
        }

        syncZoomVisibleViewport();
        window.addEventListener('resize', syncZoomVisibleViewport);
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', syncZoomVisibleViewport);
          window.visualViewport.addEventListener('scroll', syncZoomVisibleViewport);
        }

        function hideZoomChatToast() {
          if (zoomChatToastTimer) window.clearTimeout(zoomChatToastTimer);
          zoomChatToastTimer = null;
          if (zoomChatToast) zoomChatToast.hidden = true;
        }

        function showZoomChatToast(chatMessage) {
          if (zoomChatNotificationsMuted || !zoomChatToast || !chatMessage || !zoomChatPanel.hidden || !zoomOptionsPanel.hidden) return;
          zoomChatToastSender.textContent = 'From ' + chatMessage.sender +
            (chatMessage.receiver ? ' · to ' + chatMessage.receiver : '');
          zoomChatToastPreview.textContent = chatMessage.text;
          zoomChatToast.hidden = false;
          if (zoomChatToastTimer) window.clearTimeout(zoomChatToastTimer);
          zoomChatToastTimer = window.setTimeout(hideZoomChatToast, 6500);
        }

        function findNativeZoomChatToast(start) {
          var zoomRoot = document.getElementById('zmmtg-root');
          var element = start && start.nodeType === 1 ? start : start && start.parentElement;
          var depth = 0;
          while (element && element !== document.body && element !== zoomRoot && depth < 10) {
            if (!element.closest('#galaxy-zoom-chat-toast') && !element.closest('#galaxy-zoom-chat') &&
              !element.closest('#galaxy-zoom-options')) {
              var text = (element.textContent || '').replace(/\s+/g, ' ').trim();
              var rect = element.getBoundingClientRect();
              if (text.length > 0 && text.length < 500 && /\bfrom\s+.{1,140}\s+to\s+.{1,100}\b/i.test(text) &&
                rect.width >= 120 && rect.width <= window.innerWidth + 16 && rect.height >= 24 && rect.height <= 180) {
                return element;
              }
            }
            element = element.parentElement;
            depth++;
          }
          return null;
        }

        function hideNativeZoomChatToast(element) {
          if (!element || element.getAttribute('data-galaxy-chat-toast-hidden') === 'true') return;
          element.setAttribute('data-galaxy-chat-toast-hidden', 'true');
          element.setAttribute('aria-hidden', 'true');
          element.style.setProperty('display', 'none', 'important');
        }

        function suppressNativeZoomChatToasts() {
          var zoomRoot = document.getElementById('zmmtg-root');
          if (!zoomRoot || !window.MutationObserver) return;
          var observer = new MutationObserver(function (changes) {
            changes.forEach(function (change) {
              var nodes = [];
              if (change.target && change.target.nodeType === 1) nodes.push(change.target);
              if (change.addedNodes) {
                Array.prototype.forEach.call(change.addedNodes, function (node) {
                  if (node.nodeType === 1) nodes.push(node);
                });
              }
              nodes.forEach(function (node) {
                var candidates = [node];
                if (node.querySelectorAll) {
                  Array.prototype.slice.call(node.querySelectorAll('*'), 0, 80).forEach(function (child) {
                    candidates.push(child);
                  });
                }
                candidates.forEach(function (candidate) {
                  hideNativeZoomChatToast(findNativeZoomChatToast(candidate));
                });
              });
            });
          });
          observer.observe(zoomRoot, { childList: true, subtree: true, characterData: true });
        }

        suppressNativeZoomChatToasts();

        function zoomChatName(value) {
          if (typeof value === 'string') return value;
          if (!value || typeof value !== 'object') return '';
          return value.name || value.displayName || value.userName || value.senderName || '';
        }

        function zoomChatText(value, depth) {
          if (typeof value === 'string') return value;
          if (!value || depth > 4) return '';
          if (Array.isArray(value)) {
            return value.map(function (part) {
              return zoomChatText(part && (part.strContent || part.content || part.text || part.message), depth + 1);
            }).join('');
          }
          if (typeof value === 'object') {
            return zoomChatText(value.strContent || value.content || value.message || value.msgContent || value.text, depth + 1);
          }
          return '';
        }

        function normalizeZoomChatMessage(data) {
          var sources = [];
          function addSource(source) {
            if (source && typeof source === 'object' && sources.indexOf(source) < 0) sources.push(source);
          }
          addSource(data);
          if (data && typeof data === 'object') {
            ['chatMsg', 'chatMessage', 'messageInfo', 'messageData', 'msg', 'data', 'result'].forEach(function (key) {
              addSource(data[key]);
            });
          }
          function valueFor(keys) {
            for (var sourceIndex = 0; sourceIndex < sources.length; sourceIndex++) {
              for (var keyIndex = 0; keyIndex < keys.length; keyIndex++) {
                var value = sources[sourceIndex][keys[keyIndex]];
                if (value !== undefined && value !== null && value !== '') return value;
              }
            }
            return null;
          }
          var text = zoomChatText(valueFor(['message', 'content', 'msgContent', 'text', 'chatMessage']), 0);
          if (!text) return null;
          var sender = zoomChatName(valueFor(['sender', 'senderName', 'senderDisplayName', 'displayName', 'userName', 'fromName'])) || 'Participant';
          var receiverValue = valueFor(['receiver', 'receiverName', 'receiverDisplayName', 'toName']);
          var isChatToAll = valueFor(['isChatToAll', 'isChatToEveryone']);
          var receiverId = valueFor(['receiverId', 'receiverUserId']);
          var receiver = zoomChatName(receiverValue) || (isChatToAll === true || Number(receiverId) === 0 ? 'Everyone' : '');
          var rawTime = valueFor(['timestamp', 'timeStamp', 'time', 'sendTime', 'date']);
          var timestamp = rawTime ? Number(rawTime) : NaN;
          if (Number.isFinite(timestamp)) {
            if (timestamp < 1000000000000) timestamp *= 1000;
          } else {
            timestamp = rawTime ? Date.parse(rawTime) : Date.now();
          }
          if (!Number.isFinite(timestamp)) timestamp = Date.now();
          return {
            id: String(valueFor(['id', 'msgId', 'messageId', 'messageID']) || ''),
            text: text,
            sender: sender,
            receiver: receiver,
            timestamp: timestamp,
            mine: sender.toLowerCase() === String(userName).toLowerCase(),
          };
        }

        function renderZoomChatMessages() {
          if (!zoomChatList) return;
          zoomChatList.replaceChildren();
          if (zoomChatMessages.length === 0) {
            var empty = document.createElement('div');
            empty.className = 'galaxy-zoom-chat-empty';
            empty.textContent = 'No messages yet';
            zoomChatList.appendChild(empty);
            return;
          }
          zoomChatMessages.forEach(function (message) {
            var card = document.createElement('article');
            card.className = 'galaxy-zoom-chat-message' + (message.mine ? ' mine' : '');
            var meta = document.createElement('div');
            meta.className = 'galaxy-zoom-chat-meta';
            var shownSender = message.mine ? 'You' : message.sender;
            var shownTime = new Date(message.timestamp).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
            meta.textContent = shownSender + (message.receiver ? ' · to ' + message.receiver : '') + ' · ' + shownTime;
            var body = document.createElement('div');
            body.className = 'galaxy-zoom-chat-body';
            body.textContent = message.text;
            card.appendChild(meta);
            card.appendChild(body);
            zoomChatList.appendChild(card);
          });
          zoomChatList.scrollTop = zoomChatList.scrollHeight;
        }

        function addZoomChatMessage(message) {
          if (!message || !message.text) return;
          if (message.id && zoomChatMessages.some(function (existing) { return existing.id === message.id; })) return;
          if (!message.id && zoomChatMessages.some(function (existing) {
            return existing.sender === message.sender && existing.text === message.text &&
              Math.abs(existing.timestamp - message.timestamp) < 5000;
          })) return;
          zoomChatMessages.push(message);
          if (zoomChatMessages.length > 200) zoomChatMessages.shift();
          renderZoomChatMessages();
          if (!message.mine) showZoomChatToast(message);
        }

        function receiveZoomChatMessage(data) {
          if (Array.isArray(data)) {
            data.forEach(receiveZoomChatMessage);
            return;
          }
          var message = normalizeZoomChatMessage(data);
          if (message) addZoomChatMessage(message);
        }

        function setZoomChatPanelOpen(open) {
          if (!zoomChatPanel) return;
          if (open) {
            hideZoomChatToast();
            setZoomOptionsPanelOpen(false);
          } else if (zoomChatInput && document.activeElement === zoomChatInput) {
            zoomChatInput.blur();
          }
          zoomChatPanel.hidden = !open;
          zoomChatPanel.setAttribute('aria-hidden', String(!open));
          if (open) {
            if (zoomChatError) zoomChatError.hidden = true;
            renderZoomChatMessages();
            syncZoomVisibleViewport();
            window.requestAnimationFrame(syncZoomVisibleViewport);
          }
        }

        function setZoomOptionsPanelOpen(open, mode) {
          if (!zoomOptionsPanel) return;
          if (open) {
            hideZoomChatToast();
            if (zoomChatInput && document.activeElement === zoomChatInput) zoomChatInput.blur();
            zoomChatPanel.hidden = true;
            zoomChatPanel.setAttribute('aria-hidden', 'true');
            var audioMode = mode === 'audio';
            zoomOptionsTitle.textContent = audioMode ? 'Audio options' : 'More options';
            zoomOptionsDescription.textContent = audioMode
              ? (joinWithAudio
                ? 'Speaker audio is connected. Use your Android volume buttons to adjust the listening volume.'
                : 'Audio is disconnected. Rejoin with audio from the meeting controls to listen.')
              : (isStudent
                ? 'Camera, microphone, screen sharing, and host controls are disabled for student attendees.'
                : 'Open meeting chat or use the Zoom meeting controls for the available host options.');
          }
          zoomOptionsPanel.hidden = !open;
          zoomOptionsPanel.setAttribute('aria-hidden', String(!open));
          if (open) {
            syncZoomVisibleViewport();
            window.requestAnimationFrame(syncZoomVisibleViewport);
          }
        }

        if (document.documentElement.classList.contains('native-embedded')) {
          document.getElementById('galaxy-zoom-chat-close').addEventListener('click', function () {
            setZoomChatPanelOpen(false);
          });

          document.getElementById('galaxy-zoom-chat-notifications').addEventListener('click', function (event) {
            event.preventDefault();
            zoomChatNotificationsMuted = !zoomChatNotificationsMuted;
            var button = event.currentTarget;
            button.setAttribute('aria-pressed', String(zoomChatNotificationsMuted));
            button.setAttribute('aria-label', zoomChatNotificationsMuted ? 'Unmute chat notifications' : 'Mute chat notifications');
            button.title = zoomChatNotificationsMuted ? 'Unmute chat notifications' : 'Mute chat notifications';
            button.textContent = zoomChatNotificationsMuted ? '🔕' : '🔔';
            if (zoomChatNotificationsMuted) hideZoomChatToast();
          });

          document.getElementById('galaxy-zoom-chat-toast-open').addEventListener('click', function (event) {
            event.preventDefault();
            event.stopPropagation();
            hideZoomChatToast();
            setZoomChatPanelOpen(true);
          });

          document.getElementById('galaxy-zoom-chat-toast-close').addEventListener('click', function (event) {
            event.preventDefault();
            event.stopPropagation();
            hideZoomChatToast();
          });

          document.getElementById('galaxy-zoom-options-close').addEventListener('click', function () {
            setZoomOptionsPanelOpen(false);
          });

          zoomOptionsPanel.addEventListener('click', function (event) {
            if (event.target === zoomOptionsPanel) setZoomOptionsPanelOpen(false);
          });

          document.getElementById('galaxy-zoom-options-chat').addEventListener('click', function () {
            setZoomOptionsPanelOpen(false);
            setZoomChatPanelOpen(true);
          });

          document.getElementById('galaxy-zoom-chat-form').addEventListener('submit', function (event) {
            event.preventDefault();
            var text = (zoomChatInput.value || '').trim();
            if (!text || !meetingJoined) return;
            if (typeof window.ZoomMtg.sendChat !== 'function') {
              zoomChatError.textContent = 'Zoom chat is unavailable right now.';
              zoomChatError.hidden = false;
              return;
            }
            zoomChatSend.disabled = true;
            zoomChatError.hidden = true;
            var completed = false;
            function sendSucceeded(result) {
              if (completed) return;
              completed = true;
              var response = result && result.result ? result.result : result;
              var id = response && (response.id || response.msgId || response.messageId || response.messageID);
              addZoomChatMessage({
                id: id ? String(id) : '',
                text: text,
                sender: userName,
                receiver: 'Everyone',
                timestamp: Date.now(),
                mine: true,
              });
              zoomChatInput.value = '';
              zoomChatSend.disabled = false;
              zoomChatInput.focus();
            }
            function sendFailed() {
              if (completed) return;
              completed = true;
              zoomChatError.textContent = 'Message not sent. Please try again.';
              zoomChatError.hidden = false;
              zoomChatSend.disabled = false;
            }
            try {
              var pendingSend = window.ZoomMtg.sendChat({ message: text, success: sendSucceeded, error: sendFailed });
              if (pendingSend && typeof pendingSend.then === 'function') pendingSend.then(sendSucceeded, sendFailed);
            } catch (error) {
              sendFailed(error);
            }
          });

          function closeZoomPopupContaining(element) {
            var zoomRoot = document.getElementById('zmmtg-root');
            var current = element;
            var fallback = null;
            var depth = 0;
            while (current && current !== zoomRoot && current !== document.body && depth < 10) {
              var identity = String(current.id || '') + ' ' + String(current.className || '');
              if (/zm-popup__visible/i.test(identity)) {
                current.style.setProperty('display', 'none', 'important');
                return;
              }
              if (/popup|dropdown|popover|menu/i.test(identity)) fallback = current;
              current = current.parentElement;
              depth++;
            }
            if (fallback) fallback.style.setProperty('display', 'none', 'important');
          }

          document.addEventListener('click', function (event) {
            var target = event.target && event.target.nodeType === 1 ? event.target : event.target && event.target.parentElement;
            if (!target || target.closest('#galaxy-zoom-chat') || target.closest('#galaxy-zoom-chat-toast') ||
              target.closest('#galaxy-zoom-options')) return;

            var nativeToast = findNativeZoomChatToast(target);
            if (nativeToast) {
              event.preventDefault();
              event.stopPropagation();
              event.stopImmediatePropagation();
              hideNativeZoomChatToast(nativeToast);
              setZoomChatPanelOpen(true);
              return;
            }

            var control = target.closest('button,[role="button"],[role="menuitem"],[aria-label],[title],a');
            if (!control) return;
            var label = [control.getAttribute('aria-label'), control.getAttribute('title'), control.innerText, control.textContent]
              .filter(Boolean).join(' ').replace(/\s+/g, ' ').trim();

            if (/\baudio\s+options?\b/i.test(label)) {
              event.preventDefault();
              event.stopPropagation();
              event.stopImmediatePropagation();
              closeZoomPopupContaining(target);
              setZoomOptionsPanelOpen(true, 'audio');
              return;
            }

            if (/\bmore\b/i.test(label) && !/\b(audio|speaker|microphone|camera|video)\b/i.test(label)) {
              event.preventDefault();
              event.stopPropagation();
              event.stopImmediatePropagation();
              setZoomOptionsPanelOpen(zoomOptionsPanel.hidden, 'more');
              return;
            }

            if (/\bchat\b/i.test(label)) {
              event.preventDefault();
              event.stopPropagation();
              event.stopImmediatePropagation();
              setZoomChatPanelOpen(zoomChatPanel.hidden);
            }
          }, true);

          document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape' && zoomChatPanel && !zoomChatPanel.hidden) {
              document.getElementById('galaxy-zoom-chat-close').click();
            } else if (event.key === 'Escape' && zoomOptionsPanel && !zoomOptionsPanel.hidden) {
              setZoomOptionsPanelOpen(false);
            }
          });
        }

        function openGalaxyPanel(panel) {
          if (panel === 'chat') {
            setZoomChatPanelOpen(true);
          } else {
            setZoomOptionsPanelOpen(true, 'more');
          }
        }

        // The Android shell provides reachable controls while the custom panels avoid the
        // Zoom mobile-web popups that render as a dim backdrop without their contents.
        window.GalaxyClassroomUi = {
          openPanel: function (panel) {
            if (panel !== 'chat' && panel !== 'more') return false;
            if (!meetingJoined) {
              pendingPanel = panel;
              postClassroomEvent('status', 'Zoom is finishing the connection…');
              return true;
            }
            openGalaxyPanel(panel);
            return true;
          },
        };

        if (new URLSearchParams(window.location.search).has('left')) {
          message.textContent = 'You left the live class.';
          detail.textContent = 'Close this window to return to Galaxy College.';
          postClassroomEvent('left');
          return;
        }
        if (!signature || !meetingNumber || (isHost && !zak)) {
          message.textContent = 'Could not open this live class.';
          detail.textContent = 'The meeting details are missing or have expired. Return to the live classes page and join again.';
          status.classList.add('error');
          postClassroomEvent('error', detail.textContent);
          return;
        }

        message.textContent = 'Loading Zoom classroom…';
        detail.textContent = 'Preparing the meeting tools. The first connection may take a little longer.';
        postClassroomEvent('status', message.textContent);
        try {
          await loadZoomSdk();
        } catch (error) {
          message.textContent = 'Zoom Meeting SDK could not be loaded.';
          detail.textContent = (error && error.message) || 'Check your connection and try again.';
          status.classList.add('error');
          postClassroomEvent('error', detail.textContent);
          return;
        }

        if (!window.ZoomMtg) {
          message.textContent = 'Zoom Meeting SDK could not be loaded.';
          detail.textContent = 'Check your connection and try again.';
          status.classList.add('error');
          postClassroomEvent('error', detail.textContent);
          return;
        }

        message.textContent = 'Preparing audio and video…';
        detail.textContent = 'Zoom loaded. Preparing the secure media connection.';
        postClassroomEvent('status', message.textContent);
        window.history.replaceState(null, '', window.location.pathname);
        window.ZoomMtg.setZoomJSLib('https://source.zoom.us/6.10.0/lib', '/av');
        window.ZoomMtg.preLoadWasm();
        window.ZoomMtg.prepareWebSDK();
        window.ZoomMtg.init({
          leaveUrl: leftUrl,
          patchJsMedia: true,
          disableInvite: true,
          disableRecord: true,
          disableCallOut: isStudent,
          disableZoomPhone: isStudent,
          disableReport: isStudent,
          disablePreview: true,
          disableJoinAudio: !joinWithAudio,
          showMeetingHeader: false,
          meetingInfo: isStudent ? ['topic', 'host'] : ['topic', 'host', 'participant'],
          isSupportAV: true,
          isSupportChat: true,
          isSupportQA: !isStudent,
          isSupportPolling: !isStudent,
          isSupportBreakout: !isStudent,
          isSupportCC: !isStudent,
          isSupportNonverbal: !isStudent,
          // The Zoom meeting API also restricts participants to host-only share;
          // this disables Zoom's browser URL sharing path for students.
          screenShare: !isStudent,
          sharingMode: 'fit',
          defaultView: 'speaker',
          success: function () {
            if (document.documentElement.classList.contains('native-embedded') &&
              typeof window.ZoomMtg.inMeetingServiceListener === 'function') {
              try {
                window.ZoomMtg.inMeetingServiceListener('onReceiveChatMsg', receiveZoomChatMessage);
              } catch (error) {
              }
            }
            message.textContent = 'Joining the Zoom meeting…';
            detail.textContent = 'Waiting for Zoom to connect you to the class.';
            postClassroomEvent('status', message.textContent);
            var joinFinished = false;
            function handleJoinError(error) {
              if (joinFinished) return;
              joinFinished = true;
              window.removeEventListener('unhandledrejection', handleUnhandledJoinRejection);
              var errorCode = Number(error && (error.errorCode || error.code));
              message.textContent = 'Could not join the Zoom meeting.';
                status.classList.add('error');
              detail.textContent = errorCode === 4011
                ? 'Zoom error 4011: this meeting belongs to a different Zoom account than the Meeting SDK app.'
                : (errorCode === 3051 || errorCode === 3052)
                  ? 'Zoom is requiring account sign-in. Ask the Zoom account admin to disable the meeting authentication requirement for this host account.'
                  : (error && (error.reason || error.message)) || 'Check that the meeting is live and try again.';

              postClassroomEvent('error', detail.textContent);
            }
            function handleUnhandledJoinRejection(event) {
              if (joinFinished) return;
              var error = event && event.reason;
              var errorCode = Number(error && (error.errorCode || error.code));
              if (errorCode !== 4011 && (!error || error.type !== 'JOIN_MEETING_FAILED')) return;
              event.preventDefault();
              handleJoinError(error);
            }

            window.addEventListener('unhandledrejection', handleUnhandledJoinRejection);
            try {
              var joinResult = window.ZoomMtg.join({
                signature: signature,
                meetingNumber: meetingNumber,
                passWord: password,
                userName: userName,
                zak: zak,
                success: function () {
                  if (joinFinished) return;
                  joinFinished = true;
                  meetingJoined = true;
                  if (pendingPanel) {
                    var requestedPanel = pendingPanel;
                    pendingPanel = null;
                    openGalaxyPanel(requestedPanel);
                  }
                  window.removeEventListener('unhandledrejection', handleUnhandledJoinRejection);
                  status.style.display = 'none';
                  document.getElementById('zmmtg-root').style.display = 'block';
                  window.ZoomMtg.showInviteFunction({ show: false });
                  window.ZoomMtg.showRecordFunction({ show: false });

                  var controlSelector = 'button,[role="button"],a';
                  var blockedControlPatterns = [
                    /\binvite\b|copy\s+(?:meeting\s+)?(?:link|url)\b|meeting\s+link\b/i
                  ];
                  var studentControlAllowlist = /\b(mute|unmute|chat|leave|participants?)\b/i;
                  var watchControls = function (blockedPatterns) {
                    var applyBlockedControls = function (root, includeChildren) {
                      if (!root || root.nodeType !== 1) return;
                      var candidates = new Set();
                      if (root.matches && root.matches(controlSelector)) candidates.add(root);
                      if (includeChildren && root.querySelectorAll) {
                        root.querySelectorAll(controlSelector).forEach(function (control) { candidates.add(control); });
                      }
                      candidates.forEach(function (control) {
                        // Never hide anything that renders media or is a large layout container:
                        // the host's video tile and the shared screen live inside such elements.
                        if (control.querySelector('video,canvas,img')) return;
                        if (control.offsetHeight > 120 || control.offsetWidth > 320) return;
                        // Match on the control's own accessible name only, not on descendant text.
                        var label = [
                          control.getAttribute('aria-label'),
                          control.getAttribute('title'),
                          control.getAttribute('data-tooltip'),
                          control.getAttribute('href')
                        ].filter(Boolean).join(' ').trim();
                        var isStudentToolbarControl = restrictStudentToolbar && control.closest && control.closest('#wc-footer');
                        if (isStudentToolbarControl && !studentControlAllowlist.test(label)) {
                          control.style.setProperty('display', 'none', 'important');
                          return;
                        }
                        if (!label) return;
                        var shouldHide = blockedPatterns.some(function (blocked, index) {
                          return blocked.test(label);
                        });
                        if (shouldHide) {
                          control.style.setProperty('display', 'none', 'important');
                        }
                      });
                    };
                    var controlRoot = document.getElementById('wc-footer') || document.getElementById('zmmtg-root') || document.body;
                    applyBlockedControls(controlRoot, true);
                    var scheduledRoots = new Map();
                    var scanScheduled = false;
                    var observer = new MutationObserver(function (changes) {
                      changes.forEach(function (change) {
                        if (change.target && change.target.nodeType === 1 && !scheduledRoots.has(change.target)) {
                          scheduledRoots.set(change.target, false);
                        }
                        change.addedNodes && change.addedNodes.forEach(function (node) {
                          if (node.nodeType === 1) scheduledRoots.set(node, true);
                        });
                      });
                      if (scanScheduled || scheduledRoots.size === 0) return;
                      scanScheduled = true;
                      window.requestAnimationFrame(function () {
                        scanScheduled = false;
                        scheduledRoots.forEach(function (includeChildren, root) {
                          applyBlockedControls(root, includeChildren);
                        });
                        scheduledRoots.clear();
                      });
                    });
                    observer.observe(controlRoot, {
                      childList: true,
                      subtree: true,
                      attributes: true,
                      attributeFilter: ['aria-label', 'title', 'data-tooltip', 'href']
                    });
                    return observer;
                  };
                  watchControls(blockedControlPatterns);
                  postClassroomEvent('joined');
                },
                error: handleJoinError,
              });
              if (joinResult && typeof joinResult.catch === 'function') {
                joinResult.catch(handleJoinError);
              }
            } catch (error) {
              handleJoinError(error);
            }
          },
          error: function (error) {
            message.textContent = 'Could not start the Zoom meeting.';
            detail.textContent = error && error.message ? error.message : 'Check your connection and try again.';
            status.classList.add('error');
            postClassroomEvent('error', detail.textContent);
          },
        });
      }());
    }, { once: true });
  </script>
</body>
