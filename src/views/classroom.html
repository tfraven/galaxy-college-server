<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Live Classroom</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1220;
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e2e8f0;
    }

    #session {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 0%, rgba(56, 189, 248, .08), transparent 48%), #0b1220;
    }

    #reconnecting {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: 50%;
      z-index: 9000;
      display: none;
      align-items: center;
      gap: 9px;
      padding: 10px 15px;
      color: #e2e8f0;
      border: 1px solid rgba(125, 211, 252, .24);
      border-radius: 999px;
      background: rgba(15, 23, 42, .96);
      box-shadow: 0 8px 30px rgba(0, 0, 0, .32);
      font-size: 13px;
      transform: translateX(-50%);
    }

    #reconnecting.visible {
      display: flex;
    }

    #reconnecting .spinner {
      width: 15px;
      height: 15px;
      border-width: 2px;
      margin: 0;
    }

    .state-screen {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
      background:
        radial-gradient(ellipse at 50% 0%, rgba(56, 189, 248, .12), transparent 54%),
        rgba(11, 18, 32, .98);
      z-index: 9999;
      opacity: 1;
      transition: opacity .22s ease;
    }

    .state-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .state-card {
      width: min(100%, 430px);
      padding: clamp(24px, 6vw, 36px);
      border: 1px solid rgba(148, 163, 184, .16);
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(24, 36, 57, .96), rgba(15, 23, 39, .98));
      box-shadow: 0 28px 90px rgba(0, 0, 0, .42), inset 0 1px rgba(255, 255, 255, .035);
      text-align: left;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 34px;
    }

    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      color: #dff6ff;
      border: 1px solid rgba(125, 211, 252, .26);
      border-radius: 14px;
      background: linear-gradient(145deg, rgba(14, 165, 233, .3), rgba(37, 99, 235, .16));
    }

    .brand-name {
      color: #f8fafc;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .02em;
    }

    .brand-product {
      margin-top: 3px;
      color: #8ea0bb;
      font-size: 12px;
    }

    .loading-visual {
      display: grid;
      width: 68px;
      height: 68px;
      place-items: center;
      margin-bottom: 24px;
      border: 1px solid rgba(56, 189, 248, .16);
      border-radius: 20px;
      background: rgba(14, 165, 233, .08);
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(125, 211, 252, .16);
      border-top-color: #38bdf8;
      border-right-color: #38bdf8;
      border-radius: 50%;
      animation: spin .85s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .eyebrow {
      margin-bottom: 9px;
      color: #7dd3fc;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .state-card h1 {
      color: #f8fafc;
      font-size: clamp(22px, 6vw, 27px);
      font-weight: 700;
      letter-spacing: -.035em;
      line-height: 1.15;
    }

    #status-msg {
      margin-top: 11px;
      color: #a8b6ca;
      font-size: 14px;
      line-height: 1.55;
    }

    .progress-track {
      height: 4px;
      overflow: hidden;
      margin-top: 24px;
      border-radius: 99px;
      background: rgba(148, 163, 184, .14);
    }

    .progress-track span {
      display: block;
      width: 36%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #0ea5e9, #60a5fa);
      animation: progress 1.6s ease-in-out infinite;
    }

    @keyframes progress {
      0% {
        transform: translateX(-110%);
      }

      100% {
        transform: translateX(300%);
      }
    }

    .state-footnote {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 18px;
      color: #74849c;
      font-size: 12px;
      line-height: 1.45;
    }

    #error-msg {
      margin-top: 11px;
      color: #a8b6ca;
      font-size: 14px;
      line-height: 1.6;
    }

    .error-mark {
      display: grid;
      width: 54px;
      height: 54px;
      place-items: center;
      margin-bottom: 22px;
      color: #fda4af;
      border: 1px solid rgba(251, 113, 133, .22);
      border-radius: 18px;
      background: rgba(190, 24, 93, .12);
    }

    .retry-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 46px;
      margin-top: 25px;
      padding: 0 18px;
      color: #07111f;
      border: 0;
      border-radius: 13px;
      background: linear-gradient(135deg, #7dd3fc, #38bdf8);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s ease, filter .15s ease;
    }

    .retry-button:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }

    .retry-button:focus-visible {
      outline: 3px solid rgba(125, 211, 252, .4);
      outline-offset: 3px;
    }

    @media (max-width: 420px) {
      .state-card {
        border-radius: 20px;
      }

      .brand-row {
        margin-bottom: 28px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <div id="session"></div>
  <div id="reconnecting" role="status" aria-live="polite">
    <span class="spinner" aria-hidden="true"></span>
    Reconnecting to your class…
  </div>

  <div id="loading" class="state-screen" role="status" aria-live="polite">
    <section class="state-card">
      <div class="brand-row">
        <div class="brand-mark" aria-hidden="true">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="6" width="13" height="12" rx="3" stroke="currentColor" stroke-width="1.8" />
            <path d="m16 10 5-3v10l-5-3" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
          </svg>
        </div>
        <div>
          <p class="brand-name">College Runner</p>
          <p class="brand-product">Live classroom</p>
        </div>
      </div>
      <div class="loading-visual" aria-hidden="true">
        <div class="spinner"></div>
      </div>
      <p class="eyebrow">Live session</p>
      <h1>Opening your classroom</h1>
      <p id="status-msg">Getting your video room ready…</p>
      <div class="progress-track" aria-hidden="true"><span></span></div>
      <p class="state-footnote">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3 19 6v5c0 4.4-2.8 8.2-7 10-4.2-1.8-7-5.6-7-10V6l7-3Z" stroke="currentColor" stroke-width="1.7"
            stroke-linejoin="round" />
          <path d="m9 12 2 2 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
        Your class controls will appear here once Zoom is ready.
      </p>
    </section>
  </div>
  <div id="error" class="state-screen hidden" role="alert" aria-live="assertive">
    <section class="state-card">
      <div class="error-mark" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
          <path d="M12 9v4m0 4h.01M10.3 3.9 2.8 17a2 2 0 0 0 1.7 3h15a2 2 0 0 0 1.7-3l-7.5-13.1a2 2 0 0 0-3.4 0Z"
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <p class="eyebrow">Connection issue</p>
      <h1 id="error-title">Couldn't join this class</h1>
      <p id="error-msg"></p>
      <button class="retry-button" onclick="retryJoin()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M20 11a8 8 0 0 0-14-5L4 8m0-5v5h5m-5 5a8 8 0 0 0 14 5l2-2m0 5v-5h-5" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        Try again
      </button>
    </section>
  </div>

  <script>
    /*
     * Zoom Video SDK UI Toolkit (prebuilt UI: video grid, speaker view, screen share, chat, participants, settings).
     * The previous page used the low-level SDK but never rendered other people's video, so students saw nothing.
     * Pin the version; check https://www.npmjs.com/package/@zoom/videosdk-ui-toolkit for newer releases.
     */
    // Keep the Zoom UI Toolkit version pinned so different WebView versions
    // do not receive different SDK builds during the same class.
    var UIKIT_VERSION = '2.5.0-1';
    var UIKIT_BASE = 'https://source.zoom.us/uitoolkit/' + UIKIT_VERSION + '/';
    var originalJoinUrl = window.location.href;

    /* URL hash contract (set by the app):  #t=<zoomJwt>&s=<sessionName>&n=<userName>&h=<1|0> */
    function parseHash() {
      var out = {};
      window.location.hash.slice(1).split('&').forEach(function (pair) {
        var i = pair.indexOf('=');
        if (i > -1) out[pair.slice(0, i)] = decodeURIComponent(pair.slice(i + 1));
      });
      return out;
    }
    function post(type, extra) {
      var payload = JSON.stringify(Object.assign({ type: type }, extra || {}));
      try { if (window.ReactNativeWebView) { window.ReactNativeWebView.postMessage(payload); return; } } catch (e) { }
      if (window.parent !== window) window.parent.postMessage(payload, '*');
    }
    var joinTimer = null;
    var reconnectBannerTimer = null;
    function hide(id) { document.getElementById(id).classList.add('hidden'); }
    function show(id) { document.getElementById(id).classList.remove('hidden'); }
    function setStatus(m) { document.getElementById('status-msg').textContent = m; }
    function showError(msg) {
      if (joinTimer) { clearTimeout(joinTimer); joinTimer = null; }
      hide('loading');
      document.getElementById('error-title').textContent = "Couldn't join this class";
      document.getElementById('error-msg').textContent = msg;
      show('error');
      post('error', { message: msg });
    }
    function retryJoin() {
      post('retry');
      // Embedded clients reload from their source URL, which still holds the fragment token.
      // Preserve a standalone fallback too, because main() removes the fragment from history.
      if (!window.ReactNativeWebView && window.parent === window && originalJoinUrl) {
        window.location.replace(originalJoinUrl);
      }
    }
    function loadCss(href) {
      var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = href; document.head.appendChild(l);
    }
    function loadScript(src) {
      return new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = src; s.onload = resolve;
        s.onerror = function () { reject(new Error('sdk-load')); };
        document.head.appendChild(s);
      });
    }
    function friendly(err) {
      var r = String((err && (err.reason || err.message || err.errorMessage)) || err || '');
      if (Number(err && (err.errorCode || err.code)) === 200) {
        return 'Zoom could not retrieve this class session (error 200). Go back and rejoin. If it happens again, contact support.';
      }
      if (/sdk-load/.test(r)) return 'Could not load the Zoom classroom (version ' + UIKIT_VERSION + '). Check your connection and try again.';
      if (/SESSION_FETCH_INFO_ERROR|verify jwt failed|account does not exist or does not belong to you/i.test(r)) {
        return 'Zoom rejected this session token. The server must use Video SDK SDK credentials; OAuth Client ID/Secret and webhook tokens cannot authorize class sessions.';
      }
      if (/token|signature|jwt|expired/i.test(r)) return 'Your class pass has expired or is invalid. Go back and join again.';
      if (/timed out waiting for session to join/i.test(r)) return 'Zoom could not finish connecting. Check the Video SDK credentials and your network connection, then try again.';
      if (/network|timeout/i.test(r)) return 'Network error. Check your connection and try again.';
      if (/kick|remove/i.test(r)) return 'You were removed from the class.';
      if (/permission|denied|notallowed/i.test(r)) return 'Camera/microphone permission was blocked. Allow access and try again.';
      return 'Could not join the class. Please try again.';
    }
    function isReconnectInterruption(err) {
      if (!err) return false;
      var details = [err.type, err.name, err.reason, err.message, err.errorMessage].join(' ');
      return /RECONNECTING_MEETING|CLIENT_SESSION_STATE_RECONNECTING/i.test(details) ||
        Number(err.errorCode || err.code) === 5003;
    }

    (async function main() {
      var p = parseHash();
      // Keep the Zoom token out of browser history / screenshots of the URL bar.
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { }

      if (!p.t || !p.s || !p.n) return showError('Missing session details. Please go back and join again.');
      var isHost = p.h === '1';

      try {
        setStatus('Loading classroom...');
        loadCss(UIKIT_BASE + 'videosdk-ui-toolkit.css');
        await loadScript(UIKIT_BASE + 'videosdk-ui-toolkit.min.umd.js');
        var uitoolkit = window.UIToolkit;
        if (!uitoolkit) throw new Error('sdk-load');

        var container = document.getElementById('session');
        var closedSent = false;
        var joined = false;
        var connectionListenerAttached = false;
        var diagnosticListeners = [];
        var connectionEventCount = 0;
        var reconnectCount = 0;
        var reconnectStartedAt = null;
        var networkInfo = navigator.connection || navigator.mozConnection || navigator.webkitConnection || null;
        var onOnline = function () { logPageDiagnostic('browser-online'); };
        var onOffline = function () { logPageDiagnostic('browser-offline'); };
        var onVisibilityChange = function () { logPageDiagnostic('visibility-change'); };
        var onNetworkChange = function () { logPageDiagnostic('network-change'); };
        var joinTimeoutExtendedForReconnect = false;
        function logPageDiagnostic(eventName) {
          var userAgent = String(navigator.userAgent || '');
          var androidMatch = userAgent.match(/Android\s+([\d.]+)/i);
          var webViewMatch = userAgent.match(/(?:Chrome|Chromium)\/([\d.]+)/i);
          var details = {
            event: eventName,
            online: typeof navigator.onLine === 'boolean' ? navigator.onLine : null,
            visibility: document.visibilityState || null,
            androidVersion: androidMatch ? androidMatch[1] : null,
            webViewVersion: webViewMatch ? webViewMatch[1] : null,
            embeddedWebView: /;\s*wv\)/i.test(userAgent) || /Version\/4\.0/i.test(userAgent),
            networkType: networkInfo && typeof networkInfo.type === 'string' ? networkInfo.type : null,
            effectiveType: networkInfo && typeof networkInfo.effectiveType === 'string' ? networkInfo.effectiveType : null,
            networkRttMs: networkInfo && typeof networkInfo.rtt === 'number' && Number.isFinite(networkInfo.rtt)
              ? Math.round(networkInfo.rtt)
              : null,
            networkDownlinkMbps: networkInfo && typeof networkInfo.downlink === 'number' && Number.isFinite(networkInfo.downlink)
              ? Math.round(networkInfo.downlink * 10) / 10
              : null,
          };
          console.warn('[Classroom diagnostic]', details);
          post('diagnostic', details);
        }
        function addDiagnosticListener(eventName, normalize) {
          if (typeof uitoolkit.on !== 'function') return;
          var listener = function (event) {
            try {
              var details = normalize(event || {});
              post('diagnostic', Object.assign({ event: eventName }, details));
            } catch (e) { }
          };
          try {
            uitoolkit.on(eventName, listener);
            diagnosticListeners.push({ eventName: eventName, listener: listener });
          } catch (e) {
            console.info('[Classroom diagnostic] Listener unavailable', eventName);
          }
        }
        function removeDiagnosticListeners() {
          diagnosticListeners.forEach(function (item) {
            try { uitoolkit.off(item.eventName, item.listener); } catch (e) { }
          });
          diagnosticListeners = [];
          window.removeEventListener('online', onOnline);
          window.removeEventListener('offline', onOffline);
          document.removeEventListener('visibilitychange', onVisibilityChange);
          if (networkInfo && typeof networkInfo.removeEventListener === 'function') {
            networkInfo.removeEventListener('change', onNetworkChange);
          }
        }
        window.addEventListener('online', onOnline);
        window.addEventListener('offline', onOffline);
        document.addEventListener('visibilitychange', onVisibilityChange);
        if (networkInfo && typeof networkInfo.addEventListener === 'function') {
          networkInfo.addEventListener('change', onNetworkChange);
        }
        logPageDiagnostic('runtime-context');
        function extendJoinTimeoutForReconnect() {
          if (joined || joinTimeoutExtendedForReconnect) return;
          joinTimeoutExtendedForReconnect = true;
          if (joinTimer) clearTimeout(joinTimer);
          // Zoom keeps attempting recovery for a short period. Allow that recovery to finish
          // instead of treating the initial 45-second join watchdog as a terminal failure.
          joinTimer = setTimeout(function () {
            joinTimer = null;
            if (!joined) showError('Zoom could not reconnect. Check your network and try joining again.');
          }, 180000);
        }
        var connectionListener = function (event) {
          var state = event && event.state;
          if (!state) return;
          connectionEventCount += 1;

          if (state === 'Reconnecting') {
            var reason = event.reason || null;
            reconnectCount += 1;
            if (reconnectStartedAt === null) reconnectStartedAt = Date.now();
            // Zoom also reports failover as Reconnecting; media is unavailable until
            // recovery, so keep the in-meeting UI honest and show a delayed banner.
            extendJoinTimeoutForReconnect();
            if (!reconnectBannerTimer) {
              reconnectBannerTimer = setTimeout(function () {
                reconnectBannerTimer = null;
                document.getElementById('reconnecting').classList.add('visible');
              }, 2000);
            }
            console.info('[Classroom connection] Zoom reconnecting', { reason: reason });
            post('connection', {
              state: state,
              reason: reason,
              phase: joined ? 'joined' : 'joining',
              eventNumber: connectionEventCount,
              reconnectCount: reconnectCount,
            });
          } else if (state === 'Connected') {
            var recoveredAfterMs = reconnectStartedAt === null
              ? null
              : Math.max(0, Date.now() - reconnectStartedAt);
            reconnectStartedAt = null;
            // Cancel any pending banner and hide it immediately on recovery.
            if (reconnectBannerTimer) { clearTimeout(reconnectBannerTimer); reconnectBannerTimer = null; }
            document.getElementById('reconnecting').classList.remove('visible');
            // onJoined() is idempotent (guarded by `joined` flag); calling it here
            // handles the rare case where the SDK fires Connected before onSessionJoined.
            onJoined();
            // Forward recovery transitions as well; they are useful when diagnosing
            // devices that repeatedly lose and restore the Zoom connection.
            post('connection', {
              state: state,
              phase: joined ? 'joined' : 'joining',
              eventNumber: connectionEventCount,
              reconnectCount: reconnectCount,
              recoveredAfterMs: recoveredAfterMs,
            });
          } else if (state === 'Closed') {
            // The toolkit also emits onSessionClosed, but handle the documented
            // connection state directly so this page cannot remain visually active
            // if one of the two callbacks is missed on a particular WebView.
            onClosed();
          } else if (state === 'Fail') {
            if (reconnectBannerTimer) { clearTimeout(reconnectBannerTimer); reconnectBannerTimer = null; }
            document.getElementById('reconnecting').classList.remove('visible');
            console.warn('[Classroom connection] Zoom connection failed', {
              errorCode: event.errorCode,
              reason: event.reason,
            });
            post('connection', {
              state: state,
              reason: event.reason || null,
              errorCode: event.errorCode || null,
              phase: joined ? 'joined' : 'joining',
              eventNumber: connectionEventCount,
              reconnectCount: reconnectCount,
            });
            removeConnectionListener();
            removeDiagnosticListeners();
            // Error 200 is SESSION_FETCH_INFO_ERROR, not proof the host ended the class.
            // Keep it recoverable and show the code-specific join guidance instead.
            showError(friendly({ errorCode: event.errorCode, reason: event.reason }));
          }
          // Closed is handled by onSessionClosed, which is also emitted for a normal leave.
        };
        function removeConnectionListener() {
          if (!connectionListenerAttached) return;
          try { uitoolkit.off('connection-change', connectionListener); } catch (e) { }
          connectionListenerAttached = false;
        }
        function onJoined() {
          if (joined || closedSent) return;
          joined = true;
          if (joinTimer) { clearTimeout(joinTimer); joinTimer = null; }
          hide('loading');
          hide('error');
          if (reconnectBannerTimer) { clearTimeout(reconnectBannerTimer); reconnectBannerTimer = null; }
          document.getElementById('reconnecting').classList.remove('visible');
          post('joined', { isHost: isHost });
        }
        function onClosed() {
          if (closedSent) return;
          closedSent = true;
          if (joinTimer) { clearTimeout(joinTimer); joinTimer = null; }
          if (reconnectBannerTimer) { clearTimeout(reconnectBannerTimer); reconnectBannerTimer = null; }
          removeConnectionListener();
          removeDiagnosticListeners();
          document.getElementById('reconnecting').classList.remove('visible');
          try { uitoolkit.closeSession(container); } catch (e) { }
          post('closed', { isHost: isHost });
          hide('loading');
          document.getElementById('error-title').textContent = 'Class ended';
          document.getElementById('error-msg').textContent = 'The class has ended.';
          show('error');
          document.querySelector('#error button').style.display = 'none';
        }

        var config = {
          videoSDKJWT: p.t,
          sessionName: p.s,
          userName: p.n,
          featuresOptions: {
            // Teachers get a device-check preview before going live; students join straight in with mic/camera off.
            preview: { enable: isHost },
            video: { enable: true },
            audio: { enable: true },
            share: { enable: false },
            chat: { enable: true },
            users: { enable: true },
            settings: { enable: true },
            leave: { enable: true },
            recording: { enable: false },
            invite: { enable: false },
            phone: { enable: false },
            subsession: { enable: false },
            screenshot: {
              video: { enable: false },
              share: { enable: false },
            },
            theme: { enable: false, defaultTheme: 'dark' },
            header: { enable: false },
            footer: { enable: true },
          },
        };

        setStatus('Joining class...');
        if (!isHost) {
          joinTimer = setTimeout(function () {
            if (!joined) showError('Zoom is taking too long to connect. Check your connection and try again.');
          }, 45000);
        }
        var joinResult = uitoolkit.joinSession(container, config);
        uitoolkit.onSessionJoined(onJoined);
        uitoolkit.onSessionClosed(onClosed);

        // Attach the connection-change listener immediately after joinSession so that
        // Reconnecting/Connected events are never missed, even during the async join.
        if (typeof uitoolkit.on === 'function') {
          try {
            uitoolkit.on('connection-change', connectionListener);
            connectionListenerAttached = true;
          } catch (err) {
            console.warn('[Classroom connection] Could not attach Zoom connection listener', err);
          }
          // These SDK events distinguish connection loss from a device/audio failure.
          // Forward only stable diagnostic fields; never include identities or session data.
          addDiagnosticListener('active-media-failed', function (event) {
            return {
              mediaType: ['audio', 'video', 'sharing'].indexOf(event.type) >= 0 ? event.type : null,
              code: typeof event.code === 'number' && Number.isFinite(event.code) ? event.code : null,
            };
          });
          addDiagnosticListener('device-permission-change', function (event) {
            return {
              device: ['microphone', 'camera'].indexOf(event.name) >= 0 ? event.name : null,
              permission: ['granted', 'denied', 'prompt'].indexOf(event.state) >= 0 ? event.state : null,
            };
          });
          addDiagnosticListener('network-quality-change', function (event) {
            return {
              direction: ['uplink', 'downlink'].indexOf(event.type) >= 0 ? event.type : null,
              level: typeof event.level === 'number' && Number.isFinite(event.level) ? event.level : null,
            };
          });
          addDiagnosticListener('auto-play-audio-failed', function () { return {}; });
        }

        // The toolkit's promise is the authoritative successful join result. Use it as a
        // fallback in case the UI event fires before its handler is attached by a
        // particular toolkit build.
        Promise.resolve(joinResult).then(function () {
          onJoined();
        }).catch(function (err) {
          if (isReconnectInterruption(err)) {
            console.info('[Classroom join] Zoom interrupted the join while reconnecting; waiting for recovery.');
            extendJoinTimeoutForReconnect();
            return;
          }
          console.error('[Classroom join]', err);
          showError(friendly(err));
        });
        // joinSession also opens the teacher's device preview, which must stay interactive.
        hide('loading');
        post('ready', { isHost: isHost });
      } catch (err) {
        console.error('[Classroom]', err);
        showError(friendly(err));
      }
    })();
  </script>
</body>

</html>
