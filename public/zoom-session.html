<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Live Classroom</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #090d16; color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden; -webkit-font-smoothing: antialiased;
    }
    #joinGate {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; background: radial-gradient(circle at 50% 40%, #0f1e3a 0%, #030712 100%);
      z-index: 999; padding: 24px;
    }
    #joinGate.hidden { display: none; }
    .gate-icon { width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#6366f1);display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px rgba(99,102,241,.4); }
    .gate-icon svg{width:36px;height:36px;fill:#fff}
    .gate-title{font-size:20px;font-weight:700;color:#f8fafc;text-align:center}
    .gate-room{font-size:13px;color:#94a3b8;text-align:center;max-width:280px}
    .gate-perms{background:rgba(30,41,59,.8);border:1px solid rgba(51,65,85,.8);border-radius:10px;padding:12px 16px;max-width:300px}
    .gate-perms p{font-size:12px;color:#94a3b8;line-height:1.6;text-align:center}
    .gate-perms p b{color:#e2e8f0}
    .btn-join-gate{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;border:none;border-radius:9999px;padding:14px 36px;font-size:15px;font-weight:700;cursor:pointer;width:100%;max-width:280px;box-shadow:0 8px 25px -5px rgba(99,102,241,.5);transition:opacity .15s}
    .btn-join-gate:hover{opacity:.9} .btn-join-gate:disabled{opacity:.5;cursor:not-allowed}
    .gate-error{font-size:12px;color:#f87171;text-align:center;max-width:280px;display:none}
    .gate-error.visible{display:block}
    #classroomUI{width:100%;height:100%;display:flex;flex-direction:column;visibility:hidden}
    #classroomUI.visible{visibility:visible}
    .hud-bar{height:40px;background:rgba(15,23,42,.95);border-bottom:1px solid rgba(51,65,85,.6);display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:11px;flex-shrink:0;backdrop-filter:blur(8px)}
    .hud-left{display:flex;align-items:center;gap:8px}
    .live-pill{display:inline-flex;align-items:center;gap:5px;background:rgba(239,68,68,.18);border:1px solid rgba(239,68,68,.4);color:#fca5a5;padding:2px 8px;border-radius:9999px;font-weight:700;font-size:10px;letter-spacing:.5px}
    .pulse-dot{width:7px;height:7px;border-radius:50%;background:#ef4444;animation:pulse 1.5s infinite}
    @keyframes pulse{0%{transform:scale(.95);box-shadow:0 0 0 0 rgba(239,68,68,.7)}70%{transform:scale(1);box-shadow:0 0 0 5px rgba(239,68,68,0)}100%{transform:scale(.95);box-shadow:0 0 0 0 rgba(239,68,68,0)}}
    .room-label{color:#94a3b8;font-size:11px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .room-label b{color:#e2e8f0}
    .hud-right{display:flex;align-items:center;gap:6px}
    .status-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:600;background:rgba(30,41,59,.8);border:1px solid rgba(51,65,85,.8);color:#38bdf8}
    .status-chip.ok{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.4);color:#34d399}
    #workspace{flex:1;position:relative;background:#020617;overflow:hidden;display:flex;flex-direction:column}
    .stage-box{flex:1;position:relative;display:flex;align-items:center;justify-content:center;background:#050814}
    #stageVideo{width:100%;height:100%;object-fit:contain;display:none}
    #stageVideo.show{display:block}
    #stagePH{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(circle,#1e293b 0%,#090d16 100%)}
    #stagePH.hidden{display:none}
    .ph-avatar{width:72px;height:72px;border-radius:50%;background:#1e293b;border:2px solid #334155;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#38bdf8}
    .ph-text{font-size:14px;font-weight:600;color:#e2e8f0} .ph-sub{font-size:11px;color:#64748b}
    #pipTile{position:absolute;bottom:62px;right:12px;width:116px;height:80px;border-radius:10px;overflow:hidden;border:2px solid #334155;background:#0f172a;box-shadow:0 8px 20px -4px rgba(0,0,0,.6);z-index:40;transition:border-color .2s}
    #pipTile.active{border-color:#10b981}
    #pipVideo{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
    .pip-label{position:absolute;bottom:3px;left:5px;font-size:9px;font-weight:700;color:#f1f5f9;background:rgba(0,0,0,.65);padding:1px 5px;border-radius:3px}
    .pip-mic-dot{position:absolute;top:4px;right:4px;width:14px;height:14px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}
    #remoteGallery{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px;z-index:35;max-height:80%;overflow-y:auto}
    .peer-card{width:110px;height:74px;border-radius:7px;border:1.5px solid #3b82f6;overflow:hidden;background:#0f172a;position:relative}
    .peer-card video{width:100%;height:100%;object-fit:cover}
    .peer-name{position:absolute;bottom:2px;left:3px;font-size:9px;color:#fff;background:rgba(0,0,0,.7);padding:1px 4px;border-radius:3px;max-width:88%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .stage-overlay{position:absolute;top:10px;left:12px;background:rgba(15,23,42,.85);backdrop-filter:blur(6px);padding:5px 10px;border-radius:7px;border:1px solid rgba(51,65,85,.7);display:flex;align-items:center;gap:7px;z-index:30}
    .ov-avatar{width:22px;height:22px;border-radius:50%;background:#4f46e5;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
    .ov-name{font-size:11px;font-weight:600;color:#f8fafc} .ov-role{font-size:9px;padding:1px 5px;border-radius:3px;background:#0369a1;color:#e0f2fe;font-weight:700;text-transform:uppercase}
    #shareBanner{position:absolute;top:48px;left:12px;background:rgba(109,40,217,.2);border:1px solid rgba(139,92,246,.5);color:#c4b5fd;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:600;display:none;align-items:center;gap:5px;z-index:30}
    #shareBanner.show{display:flex}
    .audio-meter{position:absolute;bottom:62px;left:12px;background:rgba(15,23,42,.85);backdrop-filter:blur(6px);padding:4px 8px;border-radius:7px;border:1px solid rgba(51,65,85,.7);display:flex;align-items:center;gap:7px;z-index:30}
    #audioCanvas{width:48px;height:13px} .meter-txt{font-size:10px;color:#94a3b8;font-weight:600}
    .ctrl-bar{height:54px;flex-shrink:0;background:rgba(15,23,42,.97);border-top:1px solid rgba(51,65,85,.7);display:flex;align-items:center;justify-content:center;gap:10px;padding:0 14px;z-index:50}
    .btn-ctrl{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 12px;border-radius:9999px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid rgba(51,65,85,.8);background:#1e293b;color:#f8fafc;transition:all .14s ease;user-select:none}
    .btn-ctrl:hover{background:#334155;border-color:#475569} .btn-ctrl.on-grn{background:#059669;border-color:#10b981;color:#fff} .btn-ctrl.on-pur{background:#7c3aed;border-color:#8b5cf6;color:#fff}
    .btn-ctrl svg{width:14px;height:14px;fill:currentColor}
    #toast{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.95);border:1px solid rgba(56,189,248,.35);padding:7px 14px;border-radius:7px;font-size:12px;color:#e2e8f0;white-space:normal;text-align:center;z-index:200;display:none;max-width:90vw;animation:slideUp .2s ease}
    @keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
    #audioPool{display:none}
  </style>
</head>
<body>
<div id="joinGate">
  <div class="gate-icon"><svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg></div>
  <div class="gate-title" id="gateTitle">Join Live Classroom</div>
  <div class="gate-room" id="gateRoom">Connecting...</div>
  <div class="gate-perms"><p>Tap <b>Join Class</b> to start. Your browser will ask for <b>camera &amp; microphone</b> access — please allow both.</p></div>
  <button class="btn-join-gate" id="btnJoinGate" onclick="enterClassroom()">Join Class</button>
  <div class="gate-error" id="gateError"></div>
</div>

<div id="classroomUI">
  <div class="hud-bar">
    <div class="hud-left">
      <span class="live-pill"><span class="pulse-dot"></span>LIVE CLASS</span>
      <span class="room-label" id="roomLabel">Connecting...</span>
    </div>
    <div class="hud-right">
      <span class="status-chip" id="statusChip">Connecting</span>
      <span class="status-chip ok" id="peerChip">1 in class</span>
    </div>
  </div>
  <div id="workspace">
    <div class="stage-box">
      <video id="stageVideo" autoplay playsinline></video>
      <div id="stagePH">
        <div class="ph-avatar" id="phChar">?</div>
        <div class="ph-text" id="phName">Classroom Broadcast</div>
        <div class="ph-sub">Waiting for video stream...</div>
      </div>
      <div class="stage-overlay">
        <div class="ov-avatar" id="ovChar">?</div>
        <span class="ov-name" id="ovName">Instructor</span>
        <span class="ov-role" id="ovRole">Host</span>
      </div>
      <div id="shareBanner">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M20 18c1.1 0 1.99-.9 1.99-2L22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/></svg>
        <span id="shareLabel">Screen share active</span>
      </div>
      <div id="pipTile">
        <video id="pipVideo" autoplay playsinline muted></video>
        <div class="pip-label" id="pipName">You</div>
        <div class="pip-mic-dot"><svg viewBox="0 0 24 24" width="8" height="8" fill="#94a3b8" id="pipMicSvg"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/></svg></div>
      </div>
      <div id="remoteGallery"></div>
      <div class="audio-meter">
        <canvas id="audioCanvas" width="48" height="13"></canvas>
        <span class="meter-txt" id="meterTxt">Mic off</span>
      </div>
    </div>
    <div class="ctrl-bar">
      <button class="btn-ctrl" id="btnMic" onclick="toggleMic()">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        <span id="micTxt">Talk</span>
      </button>
      <button class="btn-ctrl" id="btnCam" onclick="toggleCamera()">
        <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
        <span id="camTxt">Camera</span>
      </button>
      <button class="btn-ctrl" id="btnShare" onclick="toggleShare()">
        <svg viewBox="0 0 24 24"><path d="M20 18c1.1 0 1.99-.9 1.99-2L22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/></svg>
        <span id="shareTxt">Share</span>
      </button>
      <button class="btn-ctrl" id="btnAudio" onclick="toggleAudioOutput()">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        <span id="audioTxt">Audio</span>
      </button>
    </div>
  </div>
</div>
<div id="audioPool"></div>
<div id="toast"></div>

<script>
var P = new URLSearchParams(window.location.search);
var sessionName   = P.get('room') || P.get('sessionName') || 'live_class';
var userName      = P.get('name') || P.get('userName') || 'Class Member';
var sessionId     = P.get('sessionId') || '1';
var currentUserId = P.get('userId') || String(Math.floor(Math.random() * 90000 + 10000));
var isHost        = P.get('role') === '1' || P.get('isHost') === 'true';

function resolveWsBase() {
  var wsBaseParam = P.get('wsBase');
  if (wsBaseParam) return decodeURIComponent(wsBaseParam);
  var loc = window.location;
  var proto = loc.protocol === 'https:' ? 'wss:' : 'ws:';
  return proto + '//' + loc.hostname + (loc.port ? ':' + loc.port : '');
}
var WS_URL = resolveWsBase() + '/ws';

var localStream = null, screenStream = null;
var micEnabled = false, camEnabled = false, shareEnabled = false, audioMuted = false;
var ws = null, audioCtx = null, analyser = null;
var peers = new Map(), remoteStreams = new Map();
var ICE_CONFIG = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }, { urls: 'stun:global.stun.twilio.com:3478' }] };

var $ = function(id) { return document.getElementById(id); };

$('gateTitle').textContent = 'Join: ' + sessionName;
$('gateRoom').textContent  = 'Joining as ' + userName + (isHost ? ' (Host/Teacher)' : ' (Student)');

var toastTimer = null;
function toast(msg, ms) {
  ms = ms || 3500;
  clearTimeout(toastTimer);
  var t = $('toast');
  t.textContent = msg;
  t.style.display = 'block';
  toastTimer = setTimeout(function() { t.style.display = 'none'; }, ms);
}

async function enterClassroom() {
  $('btnJoinGate').disabled = true;
  $('btnJoinGate').textContent = 'Requesting access...';
  $('gateError').classList.remove('visible');
  try {
    var stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' },
      audio: { echoCancellation: true, noiseSuppression: true }
    });
    localStream = stream;
    var vTrack = stream.getVideoTracks()[0];
    var aTrack = stream.getAudioTracks()[0];
    if (vTrack) { vTrack.enabled = true; camEnabled = true; }
    if (aTrack) { aTrack.enabled = false; micEnabled = false; }
    $('pipVideo').srcObject = stream;
    if (isHost) {
      $('stageVideo').srcObject = stream;
      $('stageVideo').classList.add('show');
      $('stagePH').classList.add('hidden');
    }
    setupAudioVis(stream);
    updateCamBtn(); updateMicBtn();
  } catch (err) {
    console.warn('[Media]', err);
    localStream = null;
    $('gateError').textContent = 'Camera/mic access denied. Joining in view-only mode.';
    $('gateError').classList.add('visible');
    await new Promise(function(r) { setTimeout(r, 1800); });
  }
  $('joinGate').classList.add('hidden');
  $('classroomUI').classList.add('visible');
  var init = (userName[0] || 'U').toUpperCase();
  $('phChar').textContent  = init;
  $('phName').textContent  = userName;
  $('ovChar').textContent  = init;
  $('ovName').textContent  = userName;
  $('ovRole').textContent  = isHost ? 'Host Faculty' : 'Student';
  $('pipName').textContent = userName + ' (You)';
  $('roomLabel').innerHTML = 'Room: <b>' + sessionName + '</b> &bull; ' + userName;
  initSignaling();
}

function setupAudioVis(stream) {
  try {
    window.AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();
    var src = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 32;
    src.connect(analyser);
    var ctx = $('audioCanvas').getContext('2d');
    var buf = new Uint8Array(analyser.frequencyBinCount);
    (function draw() {
      requestAnimationFrame(draw);
      ctx.clearRect(0, 0, 48, 13);
      if (!micEnabled) return;
      analyser.getByteFrequencyData(buf);
      for (var i = 0, x = 0; i < 7; i++, x += 6) {
        var h = Math.min(13, (buf[i] / 255) * 13 + 1);
        ctx.fillStyle = h > 9 ? '#ef4444' : '#10b981';
        ctx.fillRect(x, 13 - h, 5, h);
      }
    })();
  } catch(e) {}
}

function initSignaling() {
  $('statusChip').textContent = 'Connecting...';
  try { ws = new WebSocket(WS_URL); } catch(e) { $('statusChip').textContent = 'WS Error'; return; }
  ws.onopen = function() {
    $('statusChip').textContent = 'Classroom Live';
    $('statusChip').classList.add('ok');
    ws.send(JSON.stringify({ type: 'join', sessionId: sessionId, userId: currentUserId, userName: userName, role: isHost ? 'host' : 'student' }));
  };
  ws.onmessage = async function(evt) {
    try {
      var msg = JSON.parse(evt.data);
      if (msg.type === 'peers-list') {
        updatePeerCount(msg.peers.length + 1);
        for (var i = 0; i < msg.peers.length; i++) await createPC(msg.peers[i].userId, msg.peers[i].userName, true);
      } else if (msg.type === 'peer-joined') {
        updatePeerCount(peers.size + 2);
        toast(msg.peer.userName + ' joined the class.');
        await createPC(msg.peer.userId, msg.peer.userName, false);
      } else if (msg.type === 'signal') {
        await handleSignal(msg.fromUserId, msg.fromUserName, msg.data);
      } else if (msg.type === 'peer-left') {
        closePC(msg.userId);
        updatePeerCount(peers.size + 1);
      }
    } catch(e) { console.error('[Signal]', e); }
  };
  ws.onclose = function() {
    $('statusChip').textContent = 'Reconnecting...';
    $('statusChip').classList.remove('ok');
    setTimeout(initSignaling, 3000);
  };
}

function updatePeerCount(n) { $('peerChip').textContent = n + ' in class'; }

async function createPC(targetId, targetName, initiator) {
  if (peers.has(targetId)) return peers.get(targetId);
  var pc = new RTCPeerConnection(ICE_CONFIG);
  peers.set(targetId, pc);
  if (localStream) localStream.getTracks().forEach(function(t) { pc.addTrack(t, localStream); });
  pc.onicecandidate = function(e) {
    if (e.candidate && ws && ws.readyState === WebSocket.OPEN)
      ws.send(JSON.stringify({ type: 'signal', targetUserId: targetId, data: { candidate: e.candidate } }));
  };
  pc.ontrack = function(e) {
    var stream = e.streams[0]; if (!stream) return;
    remoteStreams.set(targetId, stream);
    attachAudio(targetId, stream);
    attachVideo(targetId, targetName, stream);
  };
  pc.onconnectionstatechange = function() {
    if (pc.connectionState === 'connected') { $('statusChip').textContent = 'HD Stream'; $('statusChip').classList.add('ok'); }
  };
  if (initiator) {
    pc.onnegotiationneeded = async function() {
      try {
        var offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        if (ws && ws.readyState === WebSocket.OPEN)
          ws.send(JSON.stringify({ type: 'signal', targetUserId: targetId, data: { sdp: pc.localDescription } }));
      } catch(e) { console.error('[Offer]', e); }
    };
  }
  return pc;
}

async function handleSignal(fromId, fromName, data) {
  var pc = peers.get(fromId) || await createPC(fromId, fromName, false);
  try {
    if (data.sdp) {
      await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
      if (data.sdp.type === 'offer') {
        var ans = await pc.createAnswer();
        await pc.setLocalDescription(ans);
        if (ws && ws.readyState === WebSocket.OPEN)
          ws.send(JSON.stringify({ type: 'signal', targetUserId: fromId, data: { sdp: pc.localDescription } }));
      }
    } else if (data.candidate) {
      await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
    }
  } catch(e) { console.error('[Signal handle]', e); }
}

function closePC(id) {
  if (peers.has(id)) { peers.get(id).close(); peers.delete(id); }
  remoteStreams.delete(id);
  var a = $('audio_' + id); if (a) a.remove();
  var c = $('card_' + id); if (c) c.remove();
  var sv = $('stageVideo');
  if (!isHost && sv.dataset.peerId === String(id)) {
    sv.srcObject = null; sv.classList.remove('show'); $('stagePH').classList.remove('hidden');
  }
}

function attachAudio(id, stream) {
  var el = $('audio_' + id);
  if (!el) { el = document.createElement('audio'); el.id = 'audio_' + id; el.autoplay = true; el.muted = audioMuted; $('audioPool').appendChild(el); }
  el.srcObject = stream;
  el.play().catch(function() { document.body.addEventListener('click', function() { el.play(); }, { once: true }); });
}

function attachVideo(id, name, stream) {
  if (!isHost) {
    var sv = $('stageVideo'); sv.srcObject = stream; sv.dataset.peerId = String(id);
    sv.classList.add('show'); sv.classList.remove('mirror'); $('stagePH').classList.add('hidden');
    var init = (name[0] || 'T').toUpperCase();
    $('ovChar').textContent = init; $('ovName').textContent = name; $('ovRole').textContent = 'Broadcaster'; $('phChar').textContent = init;
  } else {
    var card = $('card_' + id);
    if (!card) {
      card = document.createElement('div'); card.id = 'card_' + id; card.className = 'peer-card';
      card.innerHTML = '<video autoplay playsinline></video><div class="peer-name">' + name + '</div>';
      $('remoteGallery').appendChild(card);
    }
    card.querySelector('video').srcObject = stream;
  }
}

async function toggleMic() {
  if (!localStream) { toast('No microphone access.'); return; }
  var t = localStream.getAudioTracks()[0]; if (!t) { toast('No microphone detected.'); return; }
  micEnabled = !micEnabled; t.enabled = micEnabled;
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  updateMicBtn(); notifyParent({ type: 'AUDIO_TOGGLED', isAudioActive: micEnabled });
  toast(micEnabled ? 'Mic ON - class can hear you' : 'Mic muted');
}

function updateMicBtn() {
  var btn = $('btnMic'), txt = $('micTxt'), mt = $('meterTxt'), ms = $('pipMicSvg');
  if (micEnabled) { btn.classList.add('on-grn'); txt.textContent = 'Mute'; mt.textContent = 'Speaking...'; mt.style.color = '#34d399'; ms.setAttribute('fill', '#10b981'); }
  else { btn.classList.remove('on-grn'); txt.textContent = 'Talk'; mt.textContent = 'Mic off'; mt.style.color = '#94a3b8'; ms.setAttribute('fill', '#94a3b8'); }
}

async function toggleCamera() {
  if (!localStream) { toast('No camera access.'); return; }
  var t = localStream.getVideoTracks()[0]; if (!t) { toast('No camera detected.'); return; }
  camEnabled = !camEnabled; t.enabled = camEnabled;
  var pip = $('pipTile'), pv = $('pipVideo'), sv = $('stageVideo'), sph = $('stagePH');
  if (camEnabled) {
    pip.classList.add('active'); pv.style.visibility = 'visible';
    if (isHost && !shareEnabled) { sv.srcObject = localStream; sv.classList.add('show'); sph.classList.add('hidden'); }
  } else {
    pip.classList.remove('active'); pv.style.visibility = 'hidden';
    if (isHost && !shareEnabled) { sv.srcObject = null; sv.classList.remove('show'); sph.classList.remove('hidden'); }
  }
  updateCamBtn(); notifyParent({ type: 'VIDEO_TOGGLED', isVideoActive: camEnabled });
  toast(camEnabled ? 'Camera ON' : 'Camera off');
}

function updateCamBtn() {
  if (camEnabled) { $('btnCam').classList.add('on-grn'); $('camTxt').textContent = 'Stop video'; }
  else { $('btnCam').classList.remove('on-grn'); $('camTxt').textContent = 'Camera'; }
}

async function toggleShare() {
  if (shareEnabled && screenStream) { stopShare(); return; }
  try {
    var stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: { ideal: 30 } }, audio: true });
    screenStream = stream; shareEnabled = true;
    var sTrack = stream.getVideoTracks()[0];
    peers.forEach(function(pc) {
      var sender = pc.getSenders().find(function(s) { return s.track && s.track.kind === 'video'; });
      if (sender) sender.replaceTrack(sTrack);
    });
    var sv = $('stageVideo'); sv.srcObject = stream; sv.classList.add('show'); sv.classList.remove('mirror'); $('stagePH').classList.add('hidden');
    $('btnShare').classList.add('on-pur'); $('shareTxt').textContent = 'Stop share';
    $('shareBanner').classList.add('show'); $('shareLabel').textContent = userName + ' is sharing screen';
    toast('Screen sharing started');
    sTrack.onended = stopShare;
    notifyParent({ type: 'SHARE_TOGGLED', isShareActive: true });
  } catch(e) { console.warn('[Share]', e); }
}

function stopShare() {
  if (screenStream) { screenStream.getTracks().forEach(function(t) { t.stop(); }); screenStream = null; }
  shareEnabled = false;
  var camTrack = localStream && localStream.getVideoTracks()[0];
  if (camTrack) {
    peers.forEach(function(pc) {
      var sender = pc.getSenders().find(function(s) { return s.track && s.track.kind === 'video'; });
      if (sender) sender.replaceTrack(camTrack);
    });
  }
  var sv = $('stageVideo'), sph = $('stagePH');
  if (isHost && localStream) { sv.srcObject = localStream; sv.classList.add('show'); sph.classList.remove('hidden'); }
  else { sv.srcObject = null; sv.classList.remove('show'); sph.classList.remove('hidden'); }
  $('btnShare').classList.remove('on-pur'); $('shareTxt').textContent = 'Share';
  $('shareBanner').classList.remove('show');
  notifyParent({ type: 'SHARE_TOGGLED', isShareActive: false });
}

function toggleAudioOutput() {
  audioMuted = !audioMuted;
  $('audioPool').querySelectorAll('audio').forEach(function(a) { a.muted = audioMuted; });
  $('audioTxt').textContent = audioMuted ? 'Audio off' : 'Audio';
  toast(audioMuted ? 'Remote audio muted' : 'Remote audio on');
}

function notifyParent(data) {
  if (window.parent && window.parent !== window) window.parent.postMessage(data, '*');
  if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify(data));
}

window.addEventListener('message', function(evt) {
  var d = evt.data; if (!d) return;
  if (d.action === 'toggleMic' && micEnabled !== d.enabled) toggleMic();
  else if (d.action === 'toggleCamera' && camEnabled !== d.enabled) toggleCamera();
  else if (d.action === 'toggleShare') toggleShare();
  else if (d.action === 'leave') {
    if (localStream) localStream.getTracks().forEach(function(t) { t.stop(); });
    if (screenStream) screenStream.getTracks().forEach(function(t) { t.stop(); });
    peers.forEach(function(pc) { pc.close(); }); peers.clear();
    if (ws) ws.close();
  }
});
</script>
